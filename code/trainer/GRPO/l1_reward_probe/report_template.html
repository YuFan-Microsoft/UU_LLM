<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layer-1 Rollouts</title>
<style>
:root {
  --bg: #f5f5f7; --card: #ffffff; --card-2: #fafafc; --text: #1d1d1f; --muted: #6e6e73; --faint: #86868b;
  --line: rgba(0,0,0,.08); --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 24px rgba(0,0,0,.05);
  --blue: #0071e3; --blue-soft: rgba(0,113,227,.10); --green: #248a3d; --green-soft: rgba(52,199,89,.15);
  --orange: #c93400; --orange-soft: rgba(255,149,0,.16); --red: #d70015; --red-soft: rgba(255,59,48,.12);
  --gray-soft: rgba(120,120,128,.12); --header: rgba(245,245,247,.75); --hl: rgba(0,113,227,.10);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Inter, Roboto, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000; --card: #1c1c1e; --card-2: #232325; --text: #f5f5f7; --muted: #a1a1a6; --faint: #8e8e93;
    --line: rgba(255,255,255,.10); --shadow: 0 0 0 1px rgba(255,255,255,.06);
    --blue: #0a84ff; --blue-soft: rgba(10,132,255,.18); --green: #30d158; --green-soft: rgba(48,209,88,.18);
    --orange: #ff9f0a; --orange-soft: rgba(255,159,10,.18); --red: #ff453a; --red-soft: rgba(255,69,58,.18);
    --gray-soft: rgba(142,142,147,.18); --header: rgba(22,22,23,.75); --hl: rgba(10,132,255,.18);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; letter-spacing: -.01em; }
button, select { font: inherit; color: inherit; }

header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 24px;
  background: var(--header); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--line); }
header .brand { font-weight: 600; font-size: 16px; letter-spacing: -.02em; white-space: nowrap; }
header .ckpt { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.nav { display: flex; align-items: center; gap: 6px; }
.btn { border: 0; background: var(--gray-soft); border-radius: 8px; height: 30px; min-width: 30px; padding: 0 10px; cursor: pointer; transition: background .15s; }
.btn:hover { background: var(--blue-soft); color: var(--blue); }
select { border: 0; border-radius: 8px; height: 30px; padding: 0 30px 0 12px; background-color: var(--gray-soft); appearance: none; cursor: pointer; outline: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.seg { display: inline-flex; background: var(--gray-soft); border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 4px 12px; font-size: 13px; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

.layout { display: grid; grid-template-columns: minmax(320px, 2fr) 3fr; gap: 20px; padding: 20px 24px 64px; max-width: 1680px; margin: 0 auto; }
@media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } .input { position: static !important; max-height: 420px !important; } }
.card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); }
.input { position: sticky; top: 76px; max-height: calc(100vh - 96px); display: flex; flex-direction: column; overflow: hidden; }
.input .head { padding: 16px 18px 10px; }
.input h2 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
.input .meta { font-size: 12px; color: var(--muted); margin-top: 2px; font-family: var(--mono); }
.sigs { position: relative; overflow-y: auto; padding: 0 8px 10px; }
.sig { display: grid; grid-template-columns: 30px 72px auto 1fr; gap: 8px; align-items: baseline; padding: 4px 10px; border-radius: 8px; font-size: 12.5px; transition: background .12s; }
.sig .i { font-family: var(--mono); font-size: 11px; color: var(--faint); text-align: right; }
.sig .d { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sig .a { word-break: break-word; }
.sig.hl { background: var(--hl); }
.src { font-size: 10px; font-weight: 600; border-radius: 5px; padding: 1px 6px; white-space: nowrap; }
details.future { border-top: 1px solid var(--line); }
details.future summary { cursor: pointer; padding: 10px 18px; font-size: 12px; color: var(--blue); list-style: none; }
details.future summary::-webkit-details-marker { display: none; }
details.future .sigs { max-height: 260px; }
pre.minput { margin: 0 14px 14px; padding: 12px; border-radius: 10px; background: var(--gray-soft); max-height: 360px; font-size: 11.5px; }

.rollouts { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.ro .top { display: flex; align-items: center; gap: 10px; padding: 14px 18px 0; flex-wrap: wrap; }
.ro .id { font-weight: 600; font-size: 15px; letter-spacing: -.02em; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.b-pass { background: var(--green-soft); color: var(--green); } .b-rule { background: var(--orange-soft); color: var(--orange); }
.b-invalid { background: var(--red-soft); color: var(--red); } .b-trunc { background: var(--gray-soft); color: var(--muted); }
.ro .tok { margin-left: auto; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.rewards { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 18px 12px; border-bottom: 1px solid var(--line); }
.r { font-size: 11.5px; padding: 3px 8px; border-radius: 7px; background: var(--gray-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.r span { color: var(--muted); font-family: var(--mono); font-size: 10.5px; margin-right: 5px; }
.r.v { background: var(--red-soft); color: var(--red); }
.body { padding: 12px 18px 16px; }
.locale { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.locale b { color: var(--text); font-weight: 600; font-family: var(--mono); }
.interest { padding: 10px 12px; border-radius: 12px; border: 1px solid transparent; transition: background .12s, border-color .12s; }
.interest + .interest { margin-top: 4px; }
.interest:hover { background: var(--card-2); border-color: var(--line); }
.interest .nm { font-weight: 600; font-size: 14px; }
.interest .txt { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.interest .txt b { color: var(--text); font-weight: 500; margin-right: 4px; }
.topic { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; font-size: 12.5px; margin-top: 5px; padding-left: 12px; border-left: 2px solid var(--line); }
.ev { font-family: var(--mono); font-size: 10.5px; color: var(--blue); background: var(--blue-soft); border-radius: 5px; padding: 0 5px; }
.ev.bad { color: var(--red); background: var(--red-soft); }
.fut { margin-top: 8px; font-size: 12px; }
.fut summary { cursor: pointer; color: var(--green); font-weight: 500; list-style: none; }
.fut summary::-webkit-details-marker { display: none; }
.fut.none summary { color: var(--faint); cursor: default; }
.fut .row { display: grid; grid-template-columns: 34px 72px auto 1fr; gap: 6px; align-items: baseline; padding: 2px 0 2px 12px; border-left: 2px solid var(--green-soft); }
.fut .row .d { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rk { font-family: var(--mono); font-size: 10.5px; color: var(--green); background: var(--green-soft); border-radius: 5px; padding: 0 5px; text-align: center; }
pre { margin: 0; font: 12px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 640px; overflow: auto; }
.empty { color: var(--muted); font-size: 13px; }
.note { font-size: 12px; color: var(--red); margin-bottom: 8px; }
</style>
</head>
<body>
<header>
  <div class="brand">Layer-1 Rollouts</div>
  <div class="ckpt" id="ckpt"></div>
  <div class="seg" id="view"><button class="on" data-v="rendered">Rendered</button><button data-v="raw">Raw</button></div>
  <div class="nav"><button class="btn" id="prev" title="Previous prompt (k)">‹</button><select id="prompt"></select><button class="btn" id="next" title="Next prompt (j)">›</button></div>
</header>
<div class="layout">
  <div class="card input">
    <div class="head"><h2 id="ptitle"></h2><div class="meta" id="pmeta"></div></div>
    <div class="sigs" id="signals"></div>
    <details class="future"><summary id="fsum"></summary><div class="sigs" id="future"></div></details>
    <details class="future"><summary>Model input (exact prompt text)</summary><pre class="minput" id="minput"></pre></details>
  </div>
  <div class="rollouts" id="rollouts"></div>
</div>

<script id="data" type="application/json">/*__DATA__*/</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
const HUES = {MSN: 211, Bing: 174, Edge: 142, Uet: 266, Ads: 30, ChromeImports: 48, Shopping: 330, Copilot: 240};
function src(name) {
  const h = HUES[name] ?? 0, s = name in HUES ? 70 : 0;
  return `<span class="src" style="background:${dark ? `hsla(${h},${s}%,55%,.22)` : `hsla(${h},${s}%,50%,.13)`};color:${dark ? `hsl(${h},${s}%,72%)` : `hsl(${h},${s}%,32%)`}">${esc(name)}</span>`;
}
const fmt = v => v == null ? "–" : Number.isInteger(v) ? String(v) : v.toFixed(3);
const HIDDEN = new Set(["json_valid", "rule_pass"]);  // shown as badges
const K = D.top_k;

let P = 0, view = "rendered";
const S = D.settings || {};
$("ckpt").textContent = S.checkpoint ? `${S.checkpoint}  ·  T ${S.temperature}  ·  top-p ${S.top_p}` : "";
$("prompt").innerHTML = D.prompts.map((p, i) => `<option value="${i}">#${p.id} · ${p.signals.length} signals</option>`).join("");

function signalRows(list) {
  return list.map((s, i) => `<div class="sig" data-i="${i}"><span class="i">${i}</span><span class="d">${esc(s[0])}</span>${src(s[1])}<span class="a">${esc(s[2])}</span></div>`).join("");
}

// V3 answers carry no topic source: as layer1.to_record, it is rebuilt from the sources of the evidence signals.
// hits[j]: [[next-week position, rank], ...] of interest j in its top K (absent without an embedding model).
function rendered(out, sigs, hits, fut, queries) {
  const n = sigs.length, ok = i => Number.isInteger(i) && i >= 0 && i < n;
  const covered = hits ? new Set(hits.flat().map(([i]) => i)).size : null;
  return `<div class="locale">${out.interests.length} interests${hits ? ` · next-week actions in some top ${K}: <b>${covered} / ${fut.length}</b>` : ""}</div>` +
    (out.interests.length ? out.interests.map((it, j) => {
      const ev = [...new Set(it.topics.flatMap(t => t.evidence))];
      return `<div class="interest" data-ev="${ev.join(",")}" data-fut="${hits ? hits[j].map(([i]) => i).join(",") : ""}"><div class="nm">${esc(it.interest_name)}</div>
        <div class="txt"><b>Activity</b>${esc(it.actual_activity)}</div>${hits && queries ? `<div class="txt"><b>Query</b>${esc(queries[j])}</div>` : ""}
        ${it.topics.map(t => `<div class="topic"><span>${esc(t.topic)}</span>${[...new Set(t.evidence.filter(ok).map(i => sigs[i][1]))].map(src).join("")}
          ${t.evidence.map(i => `<span class="ev ${ok(i) ? "" : "bad"}">${esc(i)}</span>`).join("")}</div>`).join("")}
        ${hits ? futureHits(hits[j], fut) : ""}</div>`;
    }).join("") : `<div class="empty">No interests.</div>`);
}

// The user's next-week actions in this interest's top K, by rank.
function futureHits(h, fut) {
  if (!h.length) return `<details class="fut none"><summary>Next week: none in top ${K}</summary></details>`;
  return `<details class="fut" open><summary>Next week: ${h.length} in top ${K}</summary>` +
    h.map(([i, r]) => `<div class="row"><span class="rk">#${r}</span><span class="d">${esc(fut[i][0])}</span>${src(fut[i][1])}<span>${esc(fut[i][2])}</span></div>`).join("") +
    `</details>`;
}

function raw(text) {
  try { return `<pre>${esc(JSON.stringify(JSON.parse(text), null, 2))}</pre>`; } catch { return `<pre>${esc(text)}</pre>`; }
}

function mark(box, set) {
  let first = null;
  box.querySelectorAll(".sig").forEach(r => { const on = set.has(+r.dataset.i); r.classList.toggle("hl", on); if (on && !first) first = r; });
  if (first && (first.offsetTop < box.scrollTop || first.offsetTop > box.scrollTop + box.clientHeight - 30)) box.scrollTop = first.offsetTop - 40;
}

// Hovering an interest highlights the input signals it cites and the next-week actions it retrieves.
function highlight(ev, fut) { mark($("signals"), ev); mark($("future"), fut); }

function render() {
  const p = D.prompts[P], n = p.signals.length;
  $("prompt").value = P;
  $("ptitle").textContent = `Prompt #${p.id}`;
  $("pmeta").textContent = `${p.user_id} · ${n} signals${p.signals_dropped ? ` (${p.signals_dropped} trimmed)` : ""} · ${p.prompt_tokens} tokens`;
  $("signals").innerHTML = signalRows(p.signals);
  $("fsum").textContent = `Next-week actions (${p.future.length})`;
  $("future").innerHTML = signalRows(p.future);
  $("minput").textContent = p.model_input || "";
  $("rollouts").innerHTML = p.samples.map((s, k) => {
    const m = s.metrics, truncated = s.violations.includes("truncated");
    const badge = !m.json_valid ? `<span class="badge b-invalid">invalid JSON</span>` : m.rule_pass ? `<span class="badge b-pass">pass</span>` : `<span class="badge b-rule">rule broken</span>`;
    const rewards = Object.entries(m).filter(([key]) => !HIDDEN.has(key)).map(([key, v]) => `<span class="r"><span>${esc(key)}</span>${fmt(v)}</span>`).join("")
      + s.violations.filter(v => v !== "truncated").map(v => `<span class="r v">${esc(v)}</span>`).join("");
    const note = truncated ? "Cut off at max_tokens, so the JSON is incomplete. Raw text below."
      : "Not valid Layer-1 JSON (does not parse, or keys / types differ from the trained schema). Raw text below.";
    const body = view === "raw" ? raw(s.text) : s.output ? rendered(s.output, p.signals, s.future_hits, p.future, s.queries) : `<div class="note">${note}</div>${raw(s.text)}`;
    return `<div class="card ro"><div class="top"><span class="id">Rollout ${k}</span>${badge}${truncated ? `<span class="badge b-trunc">truncated</span>` : ""}
      </div><div class="rewards">${rewards}</div><div class="body">${body}</div></div>`;
  }).join("");
  $("rollouts").querySelectorAll(".interest").forEach(el => {
    const ids = key => new Set(el.dataset[key].split(",").filter(Boolean).map(Number));
    const ev = ids("ev"), fut = ids("fut");
    el.addEventListener("mouseenter", () => highlight(ev, fut));
    el.addEventListener("mouseleave", () => highlight(new Set(), new Set()));
  });
}

function go(i) { P = Math.max(0, Math.min(D.prompts.length - 1, i)); render(); scrollTo({top: 0}); $("signals").scrollTop = 0; }
$("prompt").addEventListener("change", e => go(+e.target.value));
$("prev").addEventListener("click", () => go(P - 1));
$("next").addEventListener("click", () => go(P + 1));
$("view").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  view = b.dataset.v; $("view").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); render();
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.key === "j") go(P + 1);
  if (e.key === "k") go(P - 1);
});
if (D.prompts.length) render();
</script>
</body>
</html>
